[SERVICE]
    Flush                 5
    Daemon                Off
    Log_Level             info

    Parsers_File          parsers.conf



# =========================================================
# SERVICE LOGS
# =========================================================

[INPUT]
    Name                  tail
    Tag                   jfrog.service

    Path                  <path_to_service.log>

    Parser                jfrog_service_parser

    DB                    /var/lib/fluent-bit/jfrog-service.db

    Mem_Buf_Limit         50MB
    Skip_Long_Lines       On
    Refresh_Interval      10



# =========================================================
# REQUEST LOGS
# =========================================================

[INPUT]
    Name                  tail
    Tag                   jfrog.request

    Path                  /opt/jfrog/**/**/*-request.log
    Exclude_Path          /opt/jfrog/**/**/*-request-out.log

    Parser                jfrog_request_parser

    DB                    /var/lib/fluent-bit/jfrog-request.db

    Mem_Buf_Limit         50MB
    Skip_Long_Lines       On
    Refresh_Interval      10



# =========================================================
# REQUEST OUT LOGS
# =========================================================

[INPUT]
    Name                  tail
    Tag                   jfrog.request_out

    Path                  /opt/jfrog/**/**/*-request-out.log

    Parser                jfrog_request_out_parser

    DB                    /var/lib/fluent-bit/jfrog-request-out.db

    Mem_Buf_Limit         50MB
    Skip_Long_Lines       On
    Refresh_Interval      10



# =========================================================
# CONSOLE LOGS (MULTILINE)
# =========================================================

[INPUT]
    Name                  tail
    Tag                   jfrog.console

    Path                  /opt/jfrog/**/**/console.log

    Multiline.Parser      jfrog_console_multiline

    DB                    /var/lib/fluent-bit/jfrog-console.db

    Mem_Buf_Limit         100MB
    Skip_Long_Lines       On
    Refresh_Interval      10



# =========================================================
# REPOSITORY PARSING - REQUEST LOGS
# =========================================================

[FILTER]
    Name                  parser
    Match                 jfrog.request

    Key_Name              repoKey

    Parser                repo_local_parser

    Preserve_Key          On
    Reserve_Data          On



[FILTER]
    Name                  parser
    Match                 jfrog.request

    Key_Name              repoKey

    Parser                repo_remote_parser

    Preserve_Key          On
    Reserve_Data          On



[FILTER]
    Name                  parser
    Match                 jfrog.request

    Key_Name              repoKey

    Parser                repo_standard_parser

    Preserve_Key          On
    Reserve_Data          On



# =========================================================
# REPOSITORY PARSING - REQUEST OUT LOGS
# =========================================================

[FILTER]
    Name                  parser
    Match                 jfrog.request_out

    Key_Name              repoKey

    Parser                repo_local_parser

    Preserve_Key          On
    Reserve_Data          On



[FILTER]
    Name                  parser
    Match                 jfrog.request_out

    Key_Name              repoKey

    Parser                repo_remote_parser

    Preserve_Key          On
    Reserve_Data          On



[FILTER]
    Name                  parser
    Match                 jfrog.request_out

    Key_Name              repoKey

    Parser                repo_standard_parser

    Preserve_Key          On
    Reserve_Data          On



# =========================================================
# REPO TYPE ENRICHMENT - REQUEST LOGS
# =========================================================

[FILTER]
    Name                  modify
    Match                 jfrog.request

    Condition             Key_Value_Equals environment dev

    Add                   repo_type local



[FILTER]
    Name                  modify
    Match                 jfrog.request

    Condition             Key_Value_Equals environment release

    Add                   repo_type local



[FILTER]
    Name                  modify
    Match                 jfrog.request

    Condition             Key_Does_Not_Exist team
    Condition             Key_Exists techtype

    Add                   repo_type remote



[FILTER]
    Name                  modify
    Match                 jfrog.request

    Condition             Key_Exists team
    Condition             Key_Does_Not_Exist environment

    Add                   repo_type standard



# =========================================================
# REPO TYPE ENRICHMENT - REQUEST OUT LOGS
# =========================================================

[FILTER]
    Name                  modify
    Match                 jfrog.request_out

    Condition             Key_Value_Equals environment dev

    Add                   repo_type local



[FILTER]
    Name                  modify
    Match                 jfrog.request_out

    Condition             Key_Value_Equals environment release

    Add                   repo_type local



[FILTER]
    Name                  modify
    Match                 jfrog.request_out

    Condition             Key_Does_Not_Exist team
    Condition             Key_Exists techtype

    Add                   repo_type remote



[FILTER]
    Name                  modify
    Match                 jfrog.request_out

    Condition             Key_Exists team
    Condition             Key_Does_Not_Exist environment

    Add                   repo_type standard



# =========================================================
# OPTIONAL METADATA
# =========================================================

[FILTER]
    Name                  record_modifier
    Match                 jfrog.*

    Record                platform jfrog



# =========================================================
# OUTPUT
# =========================================================

[OUTPUT]
    Name                  stdout
    Match                 jfrog.*
