service:
  flush: 5
  daemon: off
  log_level: info

  parsers_file:
    - parsers.conf



pipeline:

  inputs:

    # =====================================================
    # SERVICE LOGS
    # =====================================================

    - name: tail
      tag: jfrog.service

      path: /opt/jfrog/**/**/*-service.log

      parser: jfrog_service_parser

      db: /var/lib/fluent-bit/jfrog-service.db

      mem_buf_limit: 50MB
      skip_long_lines: on
      refresh_interval: 10



    # =====================================================
    # REQUEST LOGS
    # =====================================================

    - name: tail
      tag: jfrog.request

      path: /opt/jfrog/**/**/*-request.log
      exclude_path: /opt/jfrog/**/**/*-request-out.log

      parser: jfrog_request_parser

      db: /var/lib/fluent-bit/jfrog-request.db

      mem_buf_limit: 50MB
      skip_long_lines: on
      refresh_interval: 10



    # =====================================================
    # REQUEST OUT LOGS
    # =====================================================

    - name: tail
      tag: jfrog.request_out

      path: /opt/jfrog/**/**/*-request-out.log

      parser: jfrog_request_out_parser

      db: /var/lib/fluent-bit/jfrog-request-out.db

      mem_buf_limit: 50MB
      skip_long_lines: on
      refresh_interval: 10



    # =====================================================
    # CONSOLE LOGS
    # =====================================================

    - name: tail
      tag: jfrog.console

      path: /opt/jfrog/**/**/console.log

      multiline.parser: jfrog_console_multiline

      db: /var/lib/fluent-bit/jfrog-console.db

      mem_buf_limit: 100MB
      skip_long_lines: on
      refresh_interval: 10



  filters:

    # =====================================================
    # REPOSITORY / TECHTYPE EXTRACTION
    # =====================================================

    - name: lua
      match: jfrog.request

      script: /fluent-bit/scripts/repo-parser.lua
      call: parse_repo



    - name: lua
      match: jfrog.request_out

      script: /fluent-bit/scripts/repo-parser.lua
      call: parse_repo



    # =====================================================
    # OPTIONAL GLOBAL METADATA
    # =====================================================

    - name: record_modifier
      match: jfrog.*

      record:
        - platform jfrog



  outputs:

    - name: stdout
      match: jfrog.*