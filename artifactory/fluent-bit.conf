service:
  flush: 5
  daemon: off
  log_level: info
  parsers_file:
    - parsers.conf



pipeline:
  inputs:

    # =====================================================
    # SERVICE LOGS
    # =====================================================

    - name: tail
      tag: jfrog.service

      path: /opt/jfrog/**/**/*-service.log

      parser: jfrog_service_parser

      db: /var/lib/fluent-bit/jfrog-service.db

      mem_buf_limit: 50MB
      skip_long_lines: on
      refresh_interval: 10



    # =====================================================
    # REQUEST LOGS
    # =====================================================

    - name: tail
      tag: jfrog.request

      path: /opt/jfrog/**/**/*-request.log
      exclude_path: /opt/jfrog/**/**/*-request-out.log

      parser: jfrog_request_parser

      db: /var/lib/fluent-bit/jfrog-request.db

      mem_buf_limit: 50MB
      skip_long_lines: on
      refresh_interval: 10



    # =====================================================
    # REQUEST OUT LOGS
    # =====================================================

    - name: tail
      tag: jfrog.request_out

      path: /opt/jfrog/**/**/*-request-out.log

      parser: jfrog_request_out_parser

      db: /var/lib/fluent-bit/jfrog-request-out.db

      mem_buf_limit: 50MB
      skip_long_lines: on
      refresh_interval: 10



    # =====================================================
    # CONSOLE LOGS
    # =====================================================

    - name: tail
      tag: jfrog.console

      path: /opt/jfrog/**/**/console.log

      multiline.parser: jfrog_console_multiline

      db: /var/lib/fluent-bit/jfrog-console.db

      mem_buf_limit: 100MB
      skip_long_lines: on
      refresh_interval: 10



  filters:

    # =====================================================
    # REPOSITORY PARSING - REQUEST LOGS
    # =====================================================

    - name: parser
      match: jfrog.request

      key_name: repoKey

      parser: repo_local_parser

      preserve_key: on
      reserve_data: on



    - name: parser
      match: jfrog.request

      key_name: repoKey

      parser: repo_remote_parser

      preserve_key: on
      reserve_data: on



    - name: parser
      match: jfrog.request

      key_name: repoKey

      parser: repo_standard_parser

      preserve_key: on
      reserve_data: on



    # =====================================================
    # REPOSITORY PARSING - REQUEST OUT LOGS
    # =====================================================

    - name: parser
      match: jfrog.request_out

      key_name: repoKey

      parser: repo_local_parser

      preserve_key: on
      reserve_data: on



    - name: parser
      match: jfrog.request_out

      key_name: repoKey

      parser: repo_remote_parser

      preserve_key: on
      reserve_data: on



    - name: parser
      match: jfrog.request_out

      key_name: repoKey

      parser: repo_standard_parser

      preserve_key: on
      reserve_data: on



    # =====================================================
    # REPOSITORY TYPE ENRICHMENT - REQUEST LOGS
    # =====================================================

    - name: modify
      match: jfrog.request

      condition:
        - key_value_equals: environment dev

      add:
        - repo_type local



    - name: modify
      match: jfrog.request

      condition:
        - key_value_equals: environment release

      add:
        - repo_type local



    - name: modify
      match: jfrog.request

      condition:
        - key_does_not_exist: team
        - key_exists: techtype

      add:
        - repo_type remote



    - name: modify
      match: jfrog.request

      condition:
        - key_exists: team
        - key_does_not_exist: environment

      add:
        - repo_type standard



    # =====================================================
    # REPOSITORY TYPE ENRICHMENT - REQUEST OUT LOGS
    # =====================================================

    - name: modify
      match: jfrog.request_out

      condition:
        - key_value_equals: environment dev

      add:
        - repo_type local



    - name: modify
      match: jfrog.request_out

      condition:
        - key_value_equals: environment release

      add:
        - repo_type local



    - name: modify
      match: jfrog.request_out

      condition:
        - key_does_not_exist: team
        - key_exists: techtype

      add:
        - repo_type remote



    - name: modify
      match: jfrog.request_out

      condition:
        - key_exists: team
        - key_does_not_exist: environment

      add:
        - repo_type standard



    # =====================================================
    # OPTIONAL METADATA
    # =====================================================

    - name: record_modifier
      match: jfrog.*

      record:
        - platform jfrog



  outputs:

    - name: stdout
      match: jfrog.*