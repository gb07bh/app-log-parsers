# ============================================================
# Bitbucket Data Center - Fluent Bit parsers
#
# One parser per Bitbucket/Mesh log type.
#
# Timestamp normalization is intentionally NOT done here.
# The Lua filter normalizes all timestamps to @timestamp.
#
# Request direction is intentionally NOT modified here.
# Lua derives:
#   i... -> input
#   o... -> output
#
# Original request IDs are preserved.
# ============================================================


# ------------------------------------------------------------
# 1. atlassian-bitbucket-access.log
#
# Format:
# IP | protocol | request-id | username | timestamp |
# "action" | request-details | status | bytes-read |
# bytes-written | labels | duration-ms | session-id
#
# request-id:
#   i@... / i*... = request start
#   o@... / o*... = request end
# ------------------------------------------------------------
[PARSER]
    Name        bitbucket_access
    Format      regex
    Regex       ^(?<client_ip>.*?) \| (?<protocol>[^|]+?) \| (?<request_id>[io][*@][^|]+?) \| (?<username>[^|]*?) \| (?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) \| "(?<action>[^"]*)" \| (?<request_details>.*?) \| (?<status>[^|]*?) \| (?<bytes_read>[^|]*?) \| (?<bytes_written>[^|]*?) \| (?<labels>[^|]*?) \| (?<duration_ms>[^|]*?) \| (?<session_id>[^|]*?)\s*$
    Skip_Empty_Values false


# ------------------------------------------------------------
# 2. atlassian-bitbucket.log
#
# Format:
# timestamp LEVEL [thread] logger message
# ------------------------------------------------------------
[PARSER]
    Name        bitbucket_application
    Format      regex
    Regex       ^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) (?<level>[A-Z]+) \[(?<thread>[^\]]*)\] (?<logger>\S+) (?<message>.*)$
    Skip_Empty_Values false


# ------------------------------------------------------------
# 3. audit/atlassian-bitbucket-audit.log
#
# Format:
# IP | event | user | epoch-ms | affected-entity |
# event-details | request-id | session-id
#
# Example request-id:
# @8KJQAGx969x538x0
# ------------------------------------------------------------
[PARSER]
    Name        bitbucket_audit
    Format      regex
    Regex       ^(?<client_ip>.*?) \| (?<event_name>[^|]*?) \| (?<username>[^|]*?) \| (?<timestamp_ms>\d{13}) \| (?<affected_entity>[^|]*?) \| (?<event_details>.*?) \| (?<request_id>[@*][^|]*?) \| (?<session_id>[^|]*?)\s*$
    Skip_Empty_Values false


# ------------------------------------------------------------
# 4. search/bitbucket_search.log
#
# Format:
# [timestamp][LEVEL ][module ] [cluster] message
#
# The module field is padded in the native Elasticsearch-style
# log format, therefore whitespace is deliberately tolerated.
# ------------------------------------------------------------
[PARSER]
    Name        bitbucket_search
    Format      regex
    Regex       ^\[(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3})\]\[(?<level>[A-Z]+)\s*\]\s*\[(?<module>[^\]]*)\]\s*\[(?<cluster>[^\]]*)\]\s*(?<message>.*)$
    Skip_Empty_Values false


# ------------------------------------------------------------
# 5. atlassian-mesh-access.log
#
# Format:
# IP | grpc | mesh-execution-id | bitbucket-request-id |
# username | timestamp | action | request-agent |
# rpc-status | incoming-messages | outgoing-messages |
# bytes-read | bytes-written | labels | duration-ms
#
# Mesh execution ID:
#   i@... / o@...
#
# Bitbucket request ID is separate and does NOT carry i/o.
# ------------------------------------------------------------
[PARSER]
    Name        mesh_access
    Format      regex
    Regex       ^(?<client_ip>.*?) \| (?<protocol>[^|]+?) \| (?<mesh_execution_id>[io][@][^|]+?) \| (?<bitbucket_request_id>[^|]*?) \| (?<username>[^|]*?) \| (?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) \| "(?<action>[^"]*)" \| (?<request_agent>[^|]*?) \| (?<rpc_status>[^|]*?) \| (?<incoming_messages>[^|]*?) \| (?<outgoing_messages>[^|]*?) \| (?<bytes_read>[^|]*?) \| (?<bytes_written>[^|]*?) \| (?<labels>[^|]*?) \| (?<duration_ms>[^|]*?)\s*$
    Skip_Empty_Values false


# ------------------------------------------------------------
# 6. atlassian-mesh.log
#
# Format:
# timestamp LEVEL [thread] user mesh-execution-id
# bitbucket-request-id[,remote-mesh-execution-id] IP
# "action" (>out <in) logger class message
#
# The request ID may be followed by another ID separated by
# a comma when the request originated on another Mesh node.
# ------------------------------------------------------------
[PARSER]
    Name        mesh_application
    Format      regex
    Regex       ^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) (?<level>[A-Z]+) \[(?<thread>[^\]]*)\] (?<username>\S+) (?<mesh_execution_id>\S+) (?<bitbucket_request_id>[^ ]+)(?:,(?<remote_mesh_execution_id>[^ ]+))? (?<client_ip>[^ ]+) "(?<action>[^"]*)" \((?<message_counts>[^)]*)\) (?<logger>\S+) (?<class_name>\S+) (?<message>.*)$
    Skip_Empty_Values false