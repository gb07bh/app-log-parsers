# ============================================================
# Bitbucket Data Center / Mesh
# Fluent Bit parser definitions
#
# One normal parser per Bitbucket log type:
#
#   1. bitbucket_access
#   2. bitbucket_application
#   3. bitbucket_audit
#   4. bitbucket_search
#   5. mesh_access
#   6. mesh_application
#
# Plus:
#   bitbucket_application_multiline
#
# Timestamp normalization and request-ID decomposition are
# intentionally handled in bitbucket.lua.
# ============================================================


# ============================================================
# MULTILINE PARSER
#
# Used ONLY for atlassian-bitbucket.log.
#
# A new Bitbucket application log record starts with:
#
# YYYY-MM-DD HH:mm:ss,SSS LEVEL [thread]
#
# Everything that follows belongs to that record until the
# next timestamped application-log line.
#
# This allows Java stack traces to remain one event.
# ============================================================

[MULTILINE_PARSER]
    Name          bitbucket_application_multiline
    Type          regex
    Flush_Timeout 2000

    Rule          "start_state" "/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} [A-Z]+ \[/" "cont"

    Rule          "cont" "/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} [A-Z]+ \[/" "start_state"

    Rule          "cont" "/^(?!\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} [A-Z]+ \[).*/" "cont"


# ============================================================
# 1. BITBUCKET ACCESS LOG
#
# File:
#   atlassian-bitbucket-access.log
#
# HTTP example:
#
# IP | https | i@NODE... | user | timestamp |
# "GET /..." | "" "agent" | - | - | - | - | - | session
#
# SSH example:
#
# IP | ssh | o*NODE... | user | timestamp |
# SSH - git-upload-pack '/repo.git' | - |
# 0 | 123 | 1024 | labels | duration | session
#
# IMPORTANT:
# action is NOT required to be quoted.
#
# IP may contain:
#   X-Forwarded-For,Remote-IP
#
# Request ID:
#   i@NODExMINUTExREQUESTxCONCURRENT
#   o@NODExMINUTExREQUESTxCONCURRENT
#   i*NODExMINUTExREQUESTxCONCURRENT
#   o*NODExMINUTExREQUESTxCONCURRENT
# ============================================================

[PARSER]
    Name        bitbucket_access
    Format      regex

    Regex       ^(?<client_ip>[^|]+?) \| (?<protocol>[^|]+?) \| (?<request_id>[io][*@][^|]+?) \| (?<username>[^|]*?) \| (?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) \| (?<action>[^|]*?) \| (?<request_details>[^|]*?) \| (?<status>[^|]*?) \| (?<bytes_read>[^|]*?) \| (?<bytes_written>[^|]*?) \| (?<labels>[^|]*?) \| (?<duration_ms>[^|]*?) \| (?<session_id>[^|]*?)\s*$

    Skip_Empty_Values false


# ============================================================
# 2. BITBUCKET APPLICATION LOG
#
# File:
#   atlassian-bitbucket.log
#
# Normal record:
#
# timestamp LEVEL [thread] logger message
#
# Multiline aggregation happens BEFORE this parser.
# ============================================================

[PARSER]
    Name        bitbucket_application
    Format      regex

    Regex       ^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) (?<level>[A-Z]+) \[(?<thread>[^\]]*)\] (?<logger>\S+) (?<message>[\s\S]*)$

    Skip_Empty_Values false


# ============================================================
# 3. BITBUCKET AUDIT LOG
#
# File:
#   audit/atlassian-bitbucket-audit.log
#
# Example:
#
# IP | Event | user | epoch-ms | entity |
# JSON/details | @NODExMINUTExREQUESTxCONCURRENT | session
#
# Audit request IDs do NOT contain i/o.
# ============================================================

[PARSER]
    Name        bitbucket_audit
    Format      regex

    Regex       ^(?<client_ip>[^|]+?) \| (?<event_name>[^|]*?) \| (?<username>[^|]*?) \| (?<timestamp_ms>\d+) \| (?<affected_entity>[^|]*?) \| (?<event_details>.*?) \| (?<request_id>[@*][^|]+?) \| (?<session_id>[^|]*?)\s*$

    Skip_Empty_Values false


# ============================================================
# 4. BITBUCKET SEARCH LOG
#
# File:
#   search/bitbucket_search.log
#
# Format:
#
# [date][LEVEL ][module ] [cluster] message
# ============================================================

[PARSER]
    Name        bitbucket_search
    Format      regex

    Regex       ^\[(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3})\]\[(?<level>[A-Z]+)\s*\]\s*\[(?<module>[^\]]*)\]\s*\[(?<cluster>[^\]]*)\]\s*(?<message>[\s\S]*)$

    Skip_Empty_Values false


# ============================================================
# 5. MESH ACCESS LOG
#
# File:
#   atlassian-mesh-access.log
#
# Example:
#
# IP | grpc | i@MESHNODExMINUTExREQUESTxCONCURRENT |
# @BITBUCKETNODExMINUTExREQUESTxCONCURRENT |
# username | timestamp | action | agent | rpc-status |
# incoming | outgoing | bytes-read | bytes-written |
# labels | duration
#
# Mesh execution ID contains i/o.
# Bitbucket request ID does NOT contain i/o.
# ============================================================

[PARSER]
    Name        mesh_access
    Format      regex

    Regex       ^(?<client_ip>[^|]+?) \| (?<protocol>[^|]+?) \| (?<mesh_execution_id>[io]@[^|]+?) \| (?<bitbucket_request_id>[^|]*?) \| (?<username>[^|]*?) \| (?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) \| (?<action>[^|]*?) \| (?<request_agent>[^|]*?) \| (?<rpc_status>[^|]*?) \| (?<incoming_messages>[^|]*?) \| (?<outgoing_messages>[^|]*?) \| (?<bytes_read>[^|]*?) \| (?<bytes_written>[^|]*?) \| (?<labels>[^|]*?) \| (?<duration_ms>[^|]*?)\s*$

    Skip_Empty_Values false


# ============================================================
# 6. MESH APPLICATION LOG
#
# File:
#   atlassian-mesh.log
#
# Example from Atlassian:
#
# 2022-04-12 05:39:57,408 INFO [tx:thread-2] admin
# 2CM38K4Fx339x113x2
# @5XDWX5x339x568x0,4SJOMSOBx339x40x2
# 10.229.31.195
# "TransactionService/Transact"
# (>2 <1)
# c.a.b.m.r.DefaultRepositoryManager
# Repository ...
#
# Fields:
#   timestamp
#   level
#   thread
#   username
#   mesh_execution_id
#   bitbucket_request_id
#   remote_mesh_execution_id (optional)
#   client_ip
#   action
#   message_counts
#   logger
#   class_name
#   message
#
# NOTE:
# Mesh application log's mesh execution ID is not prefixed
# with i/o in the documented example.
# ============================================================

[PARSER]
    Name        mesh_application
    Format      regex

    Regex       ^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) (?<level>[A-Z]+) \[(?<thread>[^\]]*)\] (?<username>\S+) (?<mesh_execution_id>\S+) (?<bitbucket_request_id>[^ ,]+)(?:,(?<remote_mesh_execution_id>[^ ]+))? (?<client_ip>\S+) "(?<action>[^"]*)" \((?<message_counts>[^)]*)\) (?<logger>\S+) (?<class_name>\S+) (?<message>[\s\S]*)$

    Skip_Empty_Values false

[PARSER]
    Name        bitbucket_access
    Format      regex
    Regex       ^(?<client_ip>[^|]+?) \| (?<protocol>[^|]+?) \| (?<request_id>[io][*@][^|]+?) \| (?<username>[^|]*?) \| (?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) \| (?<action>[^|]*?) \| (?<request_details>[^|]*?)(?: \| (?<access_fields>.*?))?\s*$
    Skip_Empty_Values false
